name: 하루 넘기기

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST
    - cron: '0 10 * * *'   # 매일 19:00 KST
  workflow_dispatch:
    inputs:
      gens:
        description: '이번에 돌릴 세대 수'
        default: '1'
      reset:
        description: '처음부터 다시 (yes 입력 시)'
        default: 'no'

concurrency:
  group: world
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 세대 돌리기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--gens ${{ github.event.inputs.gens || '1' }}"
          if [ "${{ github.event.inputs.reset }}" = "yes" ]; then ARGS="$ARGS --reset"; fi
          python engine/run.py $ARGS
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "today-forest-bot"
          git config user.email "today-forest-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "세대 $(python -c "import json;print(json.load(open('docs/data/state.json'))['gen'])")"
          git pull --rebase && git push

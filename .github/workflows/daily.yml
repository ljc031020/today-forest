name: 하루 넘기기

on:
  schedule:
    - cron: '17 * * * *'   # 매시간 확인. 07시·19시(KST) 차례가 지났는데 안 돌았으면 그때 돈다
  workflow_dispatch:
    inputs:
      gens:
        description: '이번에 돌릴 세대 수'
        default: '1'
      reset:
        description: '처음부터 다시 (yes 입력 시)'
        default: 'no'
      probe:
        description: '두 섬 사이 대화만 시험 (yes 입력 시, 기록 안 바뀜)'
        default: 'no'
      control:
        description: '메모를 지운 AI 비교 실험 (yes 입력 시, 결과만 control.json에 저장)'
        default: 'no'

concurrency:
  group: world
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 세대 돌리기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.probe }}" = "yes" ]; then python engine/probe.py; exit 0; fi
          if [ "${{ github.event.inputs.control }}" = "yes" ]; then python engine/control.py; exit 0; fi
          ARGS="--gens ${{ github.event.inputs.gens || '1' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--auto"; fi
          if [ "${{ github.event.inputs.reset }}" = "yes" ]; then ARGS="$ARGS --reset"; fi
          python engine/run.py $ARGS
          python engine/memlog.py || echo '기억 재현 실패 (화면의 기억 선반만 영향)'
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "today-forest-bot"
          git config user.email "today-forest-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "세대 $(python -c "import json;print(json.load(open('docs/data/state.json'))['gen'])")"
          git pull --rebase && git push

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숲 지도 — 오늘의 숲</title>
<meta name="description" content="세 섬의 AI와 단어를 노드로 보여주는 지도. 대화가 오갈 때마다 글자가 AI 사이를 날아간다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@500&family=Noto+Sans+Arabic:wght@500&family=Noto+Sans+Georgian:wght@500&family=Noto+Sans+Armenian:wght@500&family=Noto+Sans+Runic&family=Noto+Sans+Cherokee:wght@500&family=Noto+Sans+KR:wght@500&display=swap">
<link rel="stylesheet" href="forest.css">
<style>
html,body{height:100%;overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr) auto}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--rule)}
.top h1{font-size:18px;margin:0;font-weight:600;display:flex;gap:12px;align-items:baseline}
.top h1 a{color:var(--mute);text-decoration:none;font-weight:400;font-size:14px}
.top .now{font:500 13px var(--f-mono);color:var(--mute)}
.stagewrap{position:relative;min-width:0;min-height:0}
svg#map{width:100%;height:100%;display:block;user-select:none}
.panel{border-left:1px solid var(--rule);background:var(--panel);overflow:auto;padding:20px;display:grid;align-content:start;gap:16px;font-size:14px}
.panel h2{font-size:20px;margin:0;font-weight:600}
.panel h3{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:8px 0 6px}
.panel p{margin:0;line-height:1.6}
.panel .close{justify-self:start;font:500 12px var(--f-mono);color:var(--mute);background:none;border:0;padding:0;cursor:pointer}
.bottom{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 20px;border-top:1px solid var(--rule)}
.bottom button{font:500 13px var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--rule);height:34px;padding:0 12px;cursor:pointer}
.bottom button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bottom input[type=range]{flex:1;accent-color:var(--ink)}
.bottom output{font:500 13px var(--f-mono);min-width:80px;text-align:right}

/* svg */
.isle-bg{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.isle-bg.sel{stroke:var(--ink)}
.isle-name{font:600 18px var(--f-body);fill:var(--ink);cursor:pointer}
.isle-sub{font:500 12px var(--f-mono);fill:var(--mute)}
.ai circle{fill:var(--ink);stroke:var(--bg);stroke-width:3;transition:r .2s}
.ai text{font:600 11px var(--f-mono);fill:var(--bg);pointer-events:none}
.ai.new circle{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2}
.ai.new text{fill:var(--ink)}
.ai.ok circle{stroke:var(--ok);stroke-width:5}
.ai.no circle{stroke:var(--no);stroke-width:5}
.ai,.word,.isle-name{cursor:pointer}
.word .pic{opacity:.85}
.word .lbl{font-family:var(--f-glyph);font-weight:500;font-size:20px;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.word .hit{fill:transparent}
.word.pulse-ok .pic{outline:none}
.word .ring{fill:none;stroke:transparent;stroke-width:2}
.word.pulse-ok .ring{stroke:var(--ok)}
.word.pulse-no .ring{stroke:var(--no)}
.link{stroke:var(--mute);stroke-opacity:.35;fill:none;stroke-width:1.2}
.kin{stroke:var(--ink);stroke-opacity:.32;fill:none;stroke-width:1.4;stroke-dasharray:2 4}
.use{stroke:var(--ink);stroke-opacity:.08;fill:none}
.bridge{stroke:var(--no);stroke-width:2;stroke-dasharray:6 6;fill:none;opacity:.6}
.particle text{font-family:var(--f-glyph);font-weight:600;font-size:22px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.dim .ai:not(.hl),.dim .word:not(.hl){opacity:.18}
.dim .kin:not(.hl),.dim .use:not(.hl){opacity:.05}
.use.hl{stroke-opacity:.5}
.kin.hl{stroke-opacity:1}

.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);padding:8px 10px;font-size:13px;display:none;max-width:240px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.legend{position:absolute;left:16px;bottom:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block}

.log{display:grid;gap:6px}
.log .row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--tint);padding-bottom:6px}
.log img{width:22px;height:22px;border:1px solid var(--rule);background:#FAFAF8}
.log .g{font-size:18px}.log .grid3{font-size:20px}
.log .who{font:500 11px var(--f-mono);color:var(--mute)}
.ok{color:var(--ok)}.no{color:var(--no)}
.lineage{display:flex;gap:4px;flex-wrap:wrap}
.lineage>span{border:1px solid var(--rule);padding:2px 6px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:16px}
.lineage>span>small{font:500 9px var(--f-mono);color:var(--mute)}
.lineage>.same{opacity:.4}
.lineage .grid3{font-size:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.boxchars{font-family:var(--f-glyph);font-size:20px;letter-spacing:.1em;line-height:1.5;word-break:break-all}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px}
.spark i{flex:1;background:var(--ink);border-radius:2px 2px 0 0;min-height:2px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto 40%}
  .panel{border-left:0;border-top:1px solid var(--rule);grid-row:4}
  .legend{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>숲 지도 <a href="./">← 오늘의 숲</a></h1>
    <span class="now" id="now"></span>
  </div>
  <div class="stagewrap">
    <svg id="map" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" aria-label="세 섬의 AI와 단어 지도"></svg>
    <div class="tip" id="tip"></div>
    <div class="legend">
      <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg>AI</span>
      <span><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-dasharray="3 2"/></svg>이번 세대에 태어난 AI</span>
      <span><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="currentColor" stroke-dasharray="2 4"/></svg>다른 단어를 품은 단어</span>
      <span>날아가는 글자 = 지금 오가는 말</span>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
  <div class="bottom">
    <button id="play" aria-pressed="true">❚❚ 멈춤</button>
    <button id="speed">속도 1×</button>
    <input type="range" id="gen" min="1" max="1" value="1" aria-label="세대">
    <output id="genout"></output>
    <button id="tolast">지금</button>
  </div>
</div>

<script src="stage.js"></script>
<script>
(async () => {
const FS = ForestStage, esc = FS.esc;
const S = await FS.load(), M = S.meta, G = S.gens;
const KO = {water:'물',fire:'불',tree:'나무',person:'사람',mountain:'산',house:'집',sea:'바다',forest:'숲',village:'마을',volcano:'화산','big fire':'큰 불',crowd:'군중'};
const SC = M.scenes, NAME = Object.fromEntries(Object.entries(SC).map(([k,v]) => [v,k]));
const ORDER = ['line','grid','twin'];
const body = k => M.islands[k].body;
const svg = document.getElementById('map'), NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

/* ── 배치 ── */
const ISL = {
  line: {x: 300, y: 300, r: 230},
  grid: {x: 880, y: 300, r: 230},
  twin: {x: 590, y: 680, r: 200},
};
const sceneIds = Object.values(SC);
const wordPos = (k, i) => { const I = ISL[k], a = -Math.PI/2 + i * 2*Math.PI/12, rr = I.r * .74; return {x: I.x + rr*Math.cos(a), y: I.y + rr*Math.sin(a)}; };
const aiPos = (k, slot) => { const I = ISL[k], a = -Math.PI/4 + slot * Math.PI/2, rr = I.r * .26; return {x: I.x + rr*Math.cos(a), y: I.y + rr*Math.sin(a)}; };

const L = {bridge: el('g', {}, svg), isles: el('g', {}, svg), kin: el('g', {}, svg), use: el('g', {}, svg), words: el('g', {}, svg), ais: el('g', {}, svg), parts: el('g', {}, svg)};

/* 섬 */
for (const k of ORDER) {
  const I = ISL[k];
  const g = el('g', {'data-isle': k}, L.isles);
  el('circle', {class: 'isle-bg', cx: I.x, cy: I.y, r: I.r}, g);
  const t = el('text', {class: 'isle-name', x: I.x, y: I.y - I.r - 30, 'text-anchor': 'middle'}, g); t.textContent = M.islands[k].ko;
  const s = el('text', {class: 'isle-sub', x: I.x, y: I.y - I.r - 12, 'text-anchor': 'middle', id: 'sub-' + k}, g);
  t.addEventListener('click', () => select({type: 'isle', k}));
}
let bridgeEl = null;
function drawBridge(on){
  L.bridge.innerHTML = '';
  if (!on) return;
  const a = ISL.line, b = ISL.grid;
  bridgeEl = el('path', {class: 'bridge', d: `M${a.x + a.r} ${a.y} L${b.x - b.r} ${b.y}`}, L.bridge);
  const t = el('text', {x: (a.x + b.x)/2, y: a.y - 10, 'text-anchor': 'middle', class: 'isle-sub'}, L.bridge); t.textContent = '만남 · 두 섬 사이';
}

/* 단어 노드 */
const W = {};  // k -> sid -> {g, lbl, pos}
for (const k of ORDER) {
  W[k] = {};
  sceneIds.forEach((sid, i) => {
    const p = wordPos(k, i);
    const g = el('g', {class: 'word', transform: `translate(${p.x},${p.y})`}, L.words);
    el('circle', {class: 'hit', r: 30}, g);
    el('circle', {class: 'ring', r: 26}, g);
    el('image', {class: 'pic', href: `img/${sid}.png`, x: -11, y: -30, width: 22, height: 22}, g);
    const lbl = el('g', {class: 'lblg', transform: 'translate(0,10)'}, g);
    W[k][sid] = {g, lbl, p};
    g.addEventListener('mouseenter', e => hover({type: 'word', k, sid}, e));
    g.addEventListener('mouseleave', unhover);
    g.addEventListener('click', () => select({type: 'word', k, sid}));
  });
}
function drawWord(k, sid, w){
  const n = W[k][sid]; n.lbl.innerHTML = '';
  if (!w) return;
  if (body(k) === 'grid') {
    const s = 11;
    [...w].forEach((c, i) => {
      const x = (i % 3 - 1.5) * s, y = Math.floor(i / 3) * s - 2;
      el('rect', {x, y, width: s, height: s, fill: 'none', stroke: 'var(--rule)', 'stroke-width': .8}, n.lbl);
      if (c !== '.') { const t = el('text', {x: x + s/2, y: y + s*.82, 'text-anchor': 'middle', class: 's-' + (FS.SCRIPT[c]||'x'), style: 'font-family:var(--f-glyph);font-size:9px;font-weight:600'}, n.lbl); t.textContent = c; }
    });
  } else {
    const t = el('text', {class: 'lbl', 'text-anchor': 'middle', y: 12}, n.lbl);
    [...w].forEach(c => { const ts = el('tspan', {class: 's-' + (FS.SCRIPT[c]||'x')}, t); ts.textContent = c; });
  }
}

/* ── 상태 ── */
let gi = G.length - 1;          // 지금 보는 세대 (index)
let playing = true, speed = 1, acrossGens = false;
let AI = {};                     // k -> id -> {g, pos, slot}
let words = {};                  // k -> sid -> word (현재 세대)
let use = {};                    // k -> aiId -> Set(sid)
let queues = {}, feed = [];
let selected = null;

/* a가 b의 글자를 모두 품고 있으면 이어진 단어로 본다 (예: 숲 κν ⊃ 나무 κ) */
const has = (a, b) => { if (!a || !b || a === b) return false; const g = [...b].filter(c => c !== '.'); return g.length > 0 && g.length < [...a].filter(c => c !== '.').length + 1 && g.every(c => a.includes(c)) && a.replace(/\./g,'').length > g.length; };

async function loadGen(i, animateBirth){
  gi = i;
  const row = G[i], gen = await FS.gen(row.gen), prev = i > 0 ? await FS.gen(G[i-1].gen) : null;
  document.getElementById('gen').value = i + 1;
  document.getElementById('genout').textContent = `${row.gen} / ${G[G.length-1].gen}세대`;
  document.getElementById('now').textContent = `${row.gen}세대 · ${new Date(row.at).toLocaleString('ko-KR', {timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit'})}${i === G.length - 1 ? ' · 가장 최근' : ''}`;
  drawBridge(!!row.cross);
  L.kin.innerHTML = ''; L.use.innerHTML = '';
  for (const k of ORDER) {
    const I = row.islands[k];
    document.getElementById('sub-' + k).textContent = `32번 중 ${I.ok}번 통함`;
    words[k] = I.words;
    for (const sid of sceneIds) drawWord(k, sid, I.words[sid]);
    // 글자를 나눠 가진 단어끼리 잇기 (예: 숲 ⊃ 나무)
    for (let a = 0; a < 12; a++) for (let b = a + 1; b < 12; b++) {
      const sa = sceneIds[a], sb = sceneIds[b], wa = I.words[sa], wb = I.words[sb];
      if (has(wa, wb) || has(wb, wa)) {
        const p = W[k][sa].p, q = W[k][sb].p, I2 = ISL[k];
        const mx = (p.x + q.x) / 2 - I2.x, my = (p.y + q.y) / 2 - I2.y, f = 1.45;
        el('path', {class: 'kin', 'data-k': k, 'data-a': sa, 'data-b': sb, d: `M${p.x} ${p.y} Q${I2.x + mx*f} ${I2.y + my*f} ${q.x} ${q.y}`}, L.kin);
      }
    }
    // 이번 세대의 AI
    const talks = gen.islands[k].talks;
    const ids = [...new Set(talks.flatMap(t => [t.sp, t.li]))].sort((a, b) => a - b).slice(-4);
    const born = new Set();
    if (prev) for (const s of prev.islands[k].inherit || []) { const m = s.match(/→ #(\d+) 태어남/); if (m) born.add(+m[1]); }
    placeAIs(k, ids, born, animateBirth);
    use[k] = {};
    for (const t of talks) if (t.msg) (use[k][t.sp] = use[k][t.sp] || new Set()).add(t.scene);
    for (const id in use[k]) for (const sid of use[k][id]) {
      const a = AI[k][id]; if (!a) continue; const p = W[k][sid].p;
      el('line', {class: 'use', 'data-k': k, 'data-ai': id, 'data-s': sid, x1: a.pos.x, y1: a.pos.y, x2: p.x, y2: p.y}, L.use);
    }
    queues[k] = talks.filter(t => t.msg).map(t => ({...t, from: t.from || k, to: t.to || k}));
  }
  queues.cross = ((gen.cross || {}).talks || []).filter(t => t.msg);
  for (const q in queues) queues[q].pos = 0;
  if (selected) renderPanel(selected);
}

function placeAIs(k, ids, born, animate){
  const old = AI[k] || {};
  AI[k] = {};
  for (const id in old) if (!ids.includes(+id)) { const g = old[id].g; g.style.transition = 'opacity .8s'; g.style.opacity = 0; setTimeout(() => g.remove(), 800); }
  ids.forEach((id, slot) => {
    const pos = aiPos(k, slot);
    let g = old[id] && old[id].g;
    if (!g) {
      g = el('g', {class: 'ai'}, L.ais);
      el('circle', {r: 15}, g);
      const t = el('text', {'text-anchor': 'middle', y: 4}, g); t.textContent = '#' + id;
      g.addEventListener('mouseenter', e => hover({type: 'ai', k, id}, e));
      g.addEventListener('mouseleave', unhover);
      g.addEventListener('click', () => select({type: 'ai', k, id}));
      if (animate) { g.style.opacity = 0; requestAnimationFrame(() => { g.style.transition = 'opacity .8s'; g.style.opacity = 1; }); }
    }
    g.setAttribute('transform', `translate(${pos.x},${pos.y})`);
    g.classList.toggle('new', born.has(id));
    AI[k][id] = {g, pos, slot, born: born.has(id)};
  });
}

/* ── 대화 재생 ── */
const parts = [];
function launch(q, t){
  const A = AI[t.from] && AI[t.from][t.sp], B = AI[t.to] && AI[t.to][t.li];
  if (!A || !B) return;
  const g = el('g', {class: 'particle'}, L.parts);
  if (body(t.from) === 'grid') {
    const s = 9;
    [...t.msg].forEach((c, i) => { const x = (i % 3 - 1.5) * s, y = (Math.floor(i / 3) - 1.5) * s;
      el('rect', {x, y, width: s, height: s, fill: 'var(--bg)', stroke: 'var(--ink)', 'stroke-width': .6}, g);
      if (c !== '.') { const tt = el('text', {x: x + s/2, y: y + s*.82, 'text-anchor': 'middle', class: 's-' + (FS.SCRIPT[c]||'x'), style: 'font-size:8px;stroke-width:0'}, g); tt.textContent = c; } });
  } else {
    const tx = el('text', {'text-anchor': 'middle', y: 7}, g);
    [...t.msg].forEach(c => { const ts = el('tspan', {class: 's-' + (FS.SCRIPT[c]||'x')}, tx); ts.textContent = c; });
  }
  const mx = (A.pos.x + B.pos.x) / 2, my = (A.pos.y + B.pos.y) / 2;
  const dx = B.pos.x - A.pos.x, dy = B.pos.y - A.pos.y, len = Math.hypot(dx, dy) || 1;
  const bend = t.from !== t.to ? 0 : 60;
  parts.push({g, t, A: A.pos, B: B.pos, C: {x: mx - dy/len*bend, y: my + dx/len*bend}, t0: performance.now(), dur: (t.from !== t.to ? 2200 : 1300) / speed});
  A.g.classList.add('speaking');
}
function land(p){
  const t = p.t, B = AI[t.to] && AI[t.to][t.li];
  if (B) { B.g.classList.add(t.ok ? 'ok' : 'no'); setTimeout(() => B.g.classList.remove('ok', 'no'), 700 / speed); }
  const wk = t.from === t.to ? t.from : t.to, w = W[wk] && W[wk][t.scene];
  if (w) { w.g.classList.add(t.ok ? 'pulse-ok' : 'pulse-no'); setTimeout(() => w.g.classList.remove('pulse-ok', 'pulse-no'), 900 / speed); }
  feed.unshift(t); feed = feed.slice(0, 14);
  if (!selected) renderPanel(null);
}
let lastLaunch = {};
function tick(now){
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], u = Math.min(1, (now - p.t0) / p.dur), e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
    const x = (1-e)*(1-e)*p.A.x + 2*(1-e)*e*p.C.x + e*e*p.B.x, y = (1-e)*(1-e)*p.A.y + 2*(1-e)*e*p.C.y + e*e*p.B.y;
    p.g.setAttribute('transform', `translate(${x},${y}) scale(${.7 + .5*Math.sin(Math.PI*u)})`);
    p.g.style.opacity = u > .92 ? (1 - u) / .08 : 1;
    if (u >= 1) { p.g.remove(); parts.splice(i, 1); land(p); }
  }
  if (playing) {
    let allDone = true;
    for (const q in queues) {
      const Q = queues[q]; if (!Q || !Q.length) continue;
      if (Q.pos < Q.length) allDone = false;
      const gap = (q === 'cross' ? 2600 : 1500) / speed;
      if (Q.pos < Q.length && (!lastLaunch[q] || now - lastLaunch[q] > gap)) { launch(q, Q[Q.pos++]); lastLaunch[q] = now + Math.random() * 300 / speed; }
    }
    if (allDone && !parts.length) {
      if (acrossGens && gi < G.length - 1) loadGen(gi + 1, true);
      else { acrossGens = false; for (const q in queues) if (queues[q]) queues[q].pos = 0; }
    }
  }
  requestAnimationFrame(tick);
}

/* ── 강조 · 툴팁 ── */
const tip = document.getElementById('tip');
function hover(o, e){
  svg.classList.add('dim');
  const hl = [];
  if (o.type === 'ai') {
    hl.push(AI[o.k][o.id].g);
    const ss = (use[o.k] || {})[o.id] || new Set();
    for (const sid of ss) hl.push(W[o.k][sid].g);
    svg.querySelectorAll(`.use[data-k="${o.k}"][data-ai="${o.id}"]`).forEach(x => hl.push(x));
    tip.innerHTML = `<b>AI #${o.id}</b>${AI[o.k][o.id].born ? ' · 이번 세대에 태어남' : ''}<br><span class="mute">이번 세대에 말한 그림 ${ss.size}개 · 눌러서 자세히</span>`;
  } else if (o.type === 'word') {
    hl.push(W[o.k][o.sid].g);
    svg.querySelectorAll(`.kin[data-k="${o.k}"]`).forEach(x => { if (x.dataset.a === o.sid || x.dataset.b === o.sid) { hl.push(x, W[o.k][x.dataset.a].g, W[o.k][x.dataset.b].g); } });
    svg.querySelectorAll(`.use[data-k="${o.k}"][data-s="${o.sid}"]`).forEach(x => { hl.push(x); const a = AI[o.k][x.dataset.ai]; if (a) hl.push(a.g); });
    const w = words[o.k][o.sid];
    tip.innerHTML = `<b>${KO[NAME[o.sid]]}</b> ${FS.glyphs(w, body(o.k))}<br><span class="mute">${M.islands[o.k].ko}에서 이 그림을 부르는 말 · 눌러서 족보 보기</span>`;
  }
  hl.forEach(x => x.classList.add('hl'));
  const r = svg.parentElement.getBoundingClientRect();
  tip.style.display = 'block'; tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
}
function unhover(){ svg.classList.remove('dim'); svg.querySelectorAll('.hl').forEach(x => x.classList.remove('hl')); tip.style.display = 'none'; }

/* ── 오른쪽 패널 ── */
const panel = document.getElementById('panel');
function select(o){ selected = o; renderPanel(o);
  document.querySelectorAll('.isle-bg').forEach(c => c.classList.toggle('sel', !!o && c.parentElement.dataset.isle === o.k)); }
function logRows(list){
  return `<div class="log">${list.map(t => `<div class="row"><img src="img/${t.scene}.png" alt="${KO[NAME[t.scene]]}"><div>${FS.glyphs(t.msg, body(t.from || 'line'))}<div class="who">${t.from !== t.to ? esc(M.islands[t.from].ko) + ' → ' + esc(M.islands[t.to].ko) + ' · ' : ''}#${t.sp} → #${t.li}</div></div><b class="${t.ok ? 'ok' : 'no'}">${t.ok ? '✓' : '✗'}</b></div>`).join('')}</div>`;
}
async function renderPanel(o){
  const row = G[gi];
  if (!o) {
    panel.innerHTML = `<h2>이 지도 보는 법</h2>
      <p>큰 원 셋이 <b>섬</b>이다. 가운데 검은 점 넷은 그 섬에 사는 <b>AI</b>, 둘레의 그림과 글자는 그 섬이 그림마다 쓰는 <b>단어</b>다.</p>
      <p>글자가 AI 사이를 날아가면 <b>대화</b>가 오가는 중이다. 듣는 AI가 초록으로 빛나면 통했고, 빨강이면 안 통했다.</p>
      <p>점선은 <b>한 단어가 다른 단어를 품고 있다</b>는 뜻이다. '숲'이 '나무'와 이어져 있으면 숲이라는 말 안에 아직 나무가 남아 있다. 세대가 지날수록 이 선이 끊어진다.</p>
      <p class="mute">섬, AI, 단어를 누르면 자세한 이야기가 나온다. 아래 막대로 세대를 옮길 수 있다.</p>
      <h3>방금 오간 말</h3>${feed.length ? logRows(feed) : '<p class="mute">곧 첫 대화가 시작된다.</p>'}`;
    return;
  }
  const back = '<button class="close" id="back">← 보는 법으로</button>';
  if (o.type === 'isle') {
    const k = o.k, I = row.islands[k];
    const rules = {line: '글자를 한 줄로 쓴다. 한 말에 같은 글자를 두 번 쓸 수 없다.', grid: '3×3 칸에 글자를 그림처럼 놓는다.', twin: '글자 섬과 모든 조건이 같다. 끝까지 아무도 만나지 않는다. 비교를 위한 섬이다.'};
    panel.innerHTML = `${back}<h2>${esc(M.islands[k].ko)}</h2><p>${rules[k]}</p>
      <dl class="kv"><dt>이번 세대</dt><dd>${row.gen}세대, 32번 중 ${I.ok}번 통함</dd>${I.borrow != null ? `<dt>빌려 온 글자</dt><dd>${Math.round(100*(I.borrow||0))}%의 말에 상대 섬 글자</dd>` : ''}</dl>
      <h3>세대별 통한 비율</h3><div class="spark">${G.map(g => `<i style="height:${100*g.islands[k].ok/g.islands[k].talks}%" title="${g.gen}세대 ${g.islands[k].ok}/32"></i>`).join('')}</div>
      <h3>이 섬의 글자 상자 (40자)</h3><div class="boxchars">${M.islands[k].chars.map(([c]) => FS.glyph(c)).join('')}</div>
      <h3>이번 세대의 대화</h3>${logRows(queues[k].slice(0, 12))}`;
  } else if (o.type === 'ai') {
    const k = o.k, gen = await FS.gen(row.gen);
    const mine = gen.islands[k].talks.filter(t => t.sp === o.id || t.li === o.id).map(t => ({...t, from: t.from || k, to: t.to || k}));
    const spoke = mine.filter(t => t.sp === o.id), heard = mine.filter(t => t.li === o.id);
    const firstSeen = G.find(g => g.gen && true) && null;
    panel.innerHTML = `${back}<h2>AI #${o.id}</h2><p class="mute">${esc(M.islands[k].ko)} · ${AI[k][o.id] && AI[k][o.id].born ? '이번 세대에 태어났다. 앞 세대 대화 64개 중 30개를 조금 틀리게 베껴 물려받았다.' : '앞 세대부터 살아 있다.'}</p>
      <dl class="kv"><dt>말한 횟수</dt><dd>${spoke.length}번 중 ${spoke.filter(t => t.ok).length}번 통함</dd><dt>들은 횟수</dt><dd>${heard.length}번 중 ${heard.filter(t => t.ok).length}번 맞힘</dd></dl>
      <p class="mute">AI는 사전이 없다. 최근 대화 30개만 기억하고, 그 기억으로 말하고 알아듣는다.</p>
      <h3>이번 세대에 이 AI가 한 말</h3>${spoke.length ? logRows(spoke) : '<p class="mute">이번 세대에는 말하지 않았다.</p>'}
      <h3>이 AI가 들은 말</h3>${heard.length ? logRows(heard) : '<p class="mute">-</p>'}`;
  } else if (o.type === 'word') {
    const k = o.k, sid = o.sid; let prev = null;
    const lin = G.map(g => { const w = g.islands[k].words[sid]; const same = w === prev; prev = w; return `<span class="${same ? 'same' : ''}"><small>${g.gen}</small>${FS.glyphs(w, body(k))}</span>`; }).join('');
    const kin = sceneIds.filter(s => s !== sid && (has(words[k][sid], words[k][s]) || has(words[k][s], words[k][sid])));
    const gen = await FS.gen(row.gen);
    const tries = gen.islands[k].talks.filter(t => t.scene === sid && t.msg).map(t => ({...t, from: t.from || k, to: t.to || k}));
    panel.innerHTML = `${back}<div style="display:flex;gap:12px;align-items:center"><img src="img/${sid}.png" alt="" style="width:56px;height:56px;border:1px solid var(--rule);background:#FAFAF8"><div><h2>${KO[NAME[sid]]}</h2><p class="mute">${esc(M.islands[k].ko)} · 그림이 나오는 빈도: ${{3:'자주',2:'보통',1:'드묾'}[M.tier[NAME[sid]]]}</p></div></div>
      <div style="font-size:44px;line-height:1.2">${FS.glyphs(words[k][sid], body(k))}</div>
      <h3>족보 · 세대마다 이 그림을 부른 말</h3><div class="lineage">${lin}</div>
      <h3>이어진 단어 (품고 있거나 품겨 있음)</h3>${kin.length ? `<div class="log">${kin.map(s => `<div class="row"><img src="img/${s}.png" alt=""><div>${KO[NAME[s]]} ${FS.glyphs(words[k][s], body(k))}</div><span></span></div>`).join('')}</div>` : '<p class="mute">지금은 다른 단어와 이어져 있지 않다.</p>'}
      <h3>이번 세대에 이 그림을 말한 대화</h3>${tries.length ? logRows(tries) : '<p class="mute">이번 세대에는 아무도 이 그림을 말하지 않았다.</p>'}`;
  }
  const b = document.getElementById('back'); if (b) b.onclick = () => select(null);
}

/* ── 아래 막대 ── */
const range = document.getElementById('gen');
range.max = G.length; range.value = G.length;
range.oninput = () => { acrossGens = false; loadGen(+range.value - 1, false); };
document.getElementById('tolast').onclick = () => { acrossGens = false; loadGen(G.length - 1, false); };
const playBtn = document.getElementById('play');
playBtn.onclick = () => { playing = !playing; playBtn.setAttribute('aria-pressed', playing); playBtn.textContent = playing ? '❚❚ 멈춤' : '▶ 재생'; };
const sp = document.getElementById('speed');
sp.onclick = () => { speed = speed === 1 ? 3 : speed === 3 ? 8 : 1; sp.textContent = `속도 ${speed}×`; };
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowLeft' && gi > 0) loadGen(gi - 1, false);
  if (e.key === 'ArrowRight' && gi < G.length - 1) loadGen(gi + 1, true);
  if (e.key === 'Escape') select(null);
});

await loadGen(G.length - 1, false);
renderPanel(null);
requestAnimationFrame(tick);
})();
</script>
</body>
</html>

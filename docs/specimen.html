<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점 섬 문자 표본 · 오늘의 숲</title>
<meta name="description" content="디자이너 없이 태어난 문자 — 선과 점 섬 문자 표본 시안">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500&family=Noto+Sans+Runic&family=Noto+Sans+KR:wght@500&display=swap">
<style>
/* 문자 표본 시안 02 — 글자 목록 + 말(글자의 조합) — A2 세로(420×594mm) 포스터. 1190×1684px 한 장 */
:root{--paper:#F3F4F0;--ink:#141A17;--t2:#3F4844;--t3:#5B6560;--line:#D3D8D0;--g:#0B8457;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ui:"Pretendard Variable",Pretendard,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#D9DDD6}
body{font-family:var(--ui);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
.ctl{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:3;font-size:13px}
.ctl button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:7px 11px;background:#fff;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--ink);color:#fff}
.stage{width:1190px;height:1684px;margin:24px auto;transform-origin:top center}
.poster{width:1190px;height:1684px;background:var(--paper);padding:60px 72px 52px;display:grid;grid-template-rows:auto auto auto auto auto 1fr auto;gap:0;position:relative;overflow:hidden}
.hd{display:grid;grid-template-columns:1fr auto;border-bottom:2px solid var(--ink);padding-bottom:14px;font:500 15px/1.45 var(--mono);color:var(--t2)}
.hd b{color:var(--ink);font-weight:700}
.hero{display:grid;grid-template-columns:400px 1fr;gap:44px;padding:34px 0 30px;border-bottom:1px solid var(--line);align-items:end}
.hero .big{width:400px;height:400px;display:flex;align-items:center;justify-content:center}
.hero h1{font-size:96px;line-height:1;letter-spacing:-.05em;margin:0}
.hero h1 small{display:block;font-size:20px;letter-spacing:0;color:var(--t3);font-weight:600;margin-bottom:16px;font-family:var(--mono)}
.hero dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:26px 0 0;font-size:16px;color:var(--t2)}
.hero dt{font:600 13px/1.6 var(--mono);color:var(--t3)}
.hero dd{margin:0}
.hero dd b{color:var(--ink)}
.hero .stmt{margin-top:26px;font-size:23px;line-height:1.45;font-weight:700;letter-spacing:-.02em}
.hero .stmt span{color:var(--g)}
.sh{display:flex;align-items:baseline;gap:14px;padding:22px 0 12px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh small{font:500 13px/1 var(--mono);color:var(--t3);font-weight:500}
.set{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);border-top:2px solid var(--ink);border-left:1px solid var(--line)}
.set .g{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 10px 10px;display:grid;justify-items:center;gap:4px;position:relative;text-align:center}
.set .g .no{position:absolute;left:10px;top:10px;font:600 11px/1 var(--mono);color:var(--t3)}
.set .g .lk{position:absolute;right:10px;top:10px;font:500 11px/1 var(--mono);color:var(--t3)}
.set .g .lk.hi{color:#B4471F}
.set .g b{font-size:14px;line-height:1.3}
.set .g small{font:500 11px/1.3 var(--mono);color:var(--t3)}
.words{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-left:1px solid var(--line)}
.words .w{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.words .w .gw{grid-row:span 2;display:flex;gap:2px;align-items:center;min-width:120px}
.words .w .nm{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700}
.words .w .nm img{width:22px;height:22px}
.words .w .cd{font:500 11px/1.4 var(--mono);color:var(--t3)}
.ft{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-top:22px;font-size:14px;color:var(--t2);line-height:1.6}
.ft b{color:var(--ink)}
.ft .m{font:500 12px/1.5 var(--mono);color:var(--t3);text-align:right}
body.print{background:var(--paper)}
body.print .ctl{display:none}
body.print .stage{margin:0;transform:none!important}
@page{size:420mm 594mm;margin:0}
</style>
</head>
<body>
<div class="ctl" id="ctl"></div>
<div class="stage" id="stage"><div class="poster" id="poster"></div></div>
<script src="glyph.js"></script>
<script>
(async function(){
const q = new URLSearchParams(location.search), D = q.get('d') || 'data/dots/', print = q.has('print');
const get = u => fetch(D + u, {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
const [S, L] = await Promise.all([get('summary.json'), get('likeness.json')]);
const P = document.getElementById('poster');
if (!S || !S.gens.length) { P.innerHTML = '<p>아직 실행 결과가 없어요.</p>'; return; }
const G = S.gens, last = G[G.length - 1], NOW = last.gen, K = Object.keys(S.meta.islands), AK = [...K, ...Object.keys(S.meta.paused || {})], TR = S.meta.trial_gens || 10;
const SC = S.meta.scenes, NAME = {}; for (const [en, id] of Object.entries(SC)) NAME[id] = GL.KO[en] || en;
let k = q.get('k') && AK.includes(q.get('k')) ? q.get('k') : K[0];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const order = ['forest', 'tree', 'water', 'sea', 'fire', 'big fire', 'volcano', 'mountain', 'person', 'crowd', 'house', 'village'].map(e => SC[e]).filter(Boolean);
const rows = k => G.filter(g => g.islands[k]);
function render(){
  const R = rows(k), lastK = R[R.length - 1], GEN = lastK.gen, W = lastK.islands[k].words, F = SC.forest, fw = W[F] || '';
  const LKK = L ? L.gens.find(g => g.gen === GEN) : null;
  const lk = sid => ((LKK && LKK.islands[k] && LKK.islands[k].words[sid]) || []);
  const lkm = {}; for (const sid of order) for (const x of lk(sid)) lkm[x.mark] = x;
  const ok = lastK.islands[k].ok, tk = lastK.islands[k].talks;
  const since = sid => { let i = R.length - 1; while (i > 0 && R[i - 1].islands[k].words[sid] === W[sid]) i--; return R[i].gen; };
  const has = (g, m) => Object.values(g.islands[k].words).some(w => w.split(' ').includes(m));
  const marks = {};
  for (const sid of order) for (const m of (W[sid] || '').split(' ').filter(Boolean)) { const o = marks[m] = marks[m] || {m, sids: [], n: 0}; o.n++; if (!o.sids.includes(sid)) o.sids.push(sid); }
  for (const o of Object.values(marks)) { let i = R.length - 1; while (i > 0 && has(R[i - 1], o.m)) i--; o.born = R[i].gen; }
  const SET = Object.values(marks).sort((a, b) => a.born - b.born || b.sids.length - a.sids.length);
  const idx = Object.fromEntries(SET.map((o, i) => [o.m, i + 1]));
  const cols = SET.length <= 12 ? 6 : Math.min(9, Math.ceil(SET.length / 2)), gs = cols <= 7 ? 92 : cols === 8 ? 80 : 70;
  const heroMarks = fw.split(' '), hs = heroMarks.length === 1 ? 400 : heroMarks.length === 2 ? 200 : 133;
  const trialNote = GEN > TR ? `시험 ${TR}세대 + 본 운영 ${GEN - TR}세대` : `시험 운영 ${GEN}세대`;
  P.innerHTML = `
  <div class="hd"><span><b>오늘의 숲 — 점 섬 문자 표본</b> · 시안 02</span><span>${S.meta.islands[k] || (S.meta.paused || {})[k]?.ko || k} · ${GEN}세대 · ${new Date(lastK.at).toLocaleDateString('ko-KR')}</span></div>
  <div class="hero">
    <div class="big">${heroMarks.map(m => GL.mark(m, hs, {color: '#141A17', w: hs * .075, dotColor: '#C4CAC2', pad: .16})).join('')}</div>
    <div>
      <h1><small>Figure 01 · 숲</small>문자 ${SET.length}자</h1>
      <dl>
        <dt>숲</dt><dd><b>${esc(fw.replace(/\./g, '·'))}</b> = ${heroMarks.map(m => '글자 ' + String(idx[m]).padStart(2, '0')).join(' + ')} · ${since(F)}세대부터</dd>
        <dt>말</dt><dd>그림 ${order.length}개를 글자 ${SET.length}자의 조합으로</dd>
        <dt>소통</dt><dd>${GEN}세대 ${tk}판 중 <b>${ok}판</b> 통함</dd>
        <dt>운영</dt><dd>${trialNote} · 규칙은 처음 그대로</dd>
      </dl>
      <p class="stmt">아무도 모양을 정하지 않았다.<br><span>점 아홉 개와 선, 그리고 그림 맞히기만으로.</span></p>
    </div>
  </div>
  <div class="sh">글자 ${SET.length}자 <small>태어난 순서 · 글자 아래 = 이 글자가 들어간 말 · ≈ 가장 닮은 기존 문자</small></div>
  <div class="set" style="--cols:${cols}">${SET.map((o, i) => { const x = lkm[o.m];
    return `<div class="g"><span class="no">${String(i + 1).padStart(2, '0')}</span>${x ? `<span class="lk${x.sim >= .8 ? ' hi' : ''}">≈ ${esc(x.char)}</span>` : ''}${GL.mark(o.m, gs, {color: '#141A17', w: gs * .085, dotColor: '#CDD2CA'})}<b>${o.sids.map(s => NAME[s]).join(' · ')}</b><small>${esc(o.m.replace(/\./g, '·'))}<br>${o.born}세대~</small></div>`; }).join('')}</div>
  <div class="sh">말 ${order.length}개 <small>= 위 글자의 조합 · 숫자는 글자 번호</small></div>
  <div class="words">${order.map(sid => { const w = W[sid] || '', ms = w ? w.split(' ') : [], s = ms.length <= 1 ? 76 : ms.length === 2 ? 60 : 46;
    return `<div class="w"><div class="gw">${ms.map(m => GL.mark(m, s, {color: '#141A17', w: s * .09, dotColor: '#CDD2CA'})).join('') || '<span class="cd">아직 없음</span>'}</div><div class="nm"><img src="img/${sid}.png" alt="">${NAME[sid]}</div><div class="cd">${ms.map(m => String(idx[m]).padStart(2, '0')).join(' + ')} · ${w ? since(sid) + '세대~' : ''}</div></div>`; }).join('')}</div>
  <div></div>
  <div class="ft"><p><b>만드는 법</b> — 기존 문자는 주지 않았다. AI 4명이 사는 섬에서, 말하는 AI만 그림을 보고 3×3 점 위에 선을 그어 글자를 만든다. 듣는 AI가 4장 중 맞히면 둘 다 기억한다. 하루 두 번 AI가 바뀌어도 기억은 이어진다. 그림 글자도, 글자 이어 쓰기도 막지 않았고 격자도 바꾸지 않았다. <b style="color:#B4471F">주황 ≈</b> 은 기존 문자와 거의 같음(0.8 이상).</p>
  <p class="m">이정찬 · 2026-2 디지털 스페이스<br>시안 02 — ${trialNote} 결과</p></div>`;
  document.getElementById('ctl').innerHTML = AK.map(x => `<button aria-pressed="${x === k}" data-k="${x}">${S.meta.islands[x] || S.meta.paused[x].ko}</button>`).join('');
}
document.getElementById('ctl').onclick = e => { const b = e.target.closest('button'); if (b) { k = b.dataset.k; render(); } };
render();
if (print) document.body.classList.add('print');
else { const fit = () => { const z = Math.min(1, (innerWidth - 24) / 1190); document.getElementById('stage').style.transform = `scale(${z})`; document.getElementById('stage').style.height = 1684 * z + 'px'; }; addEventListener('resize', fit); fit(); }
window.__ready = true;
})();
</script>
</body>
</html>

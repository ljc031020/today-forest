<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대화 읽기 — 오늘의 숲</title>
<meta name="description" content="세 섬의 AI들이 실제로 나눈 대화 기록.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@500&family=Noto+Sans+Arabic:wght@500&family=Noto+Sans+Georgian:wght@500&family=Noto+Sans+Armenian:wght@500&family=Noto+Sans+Runic&family=Noto+Sans+Cherokee:wght@500&family=Noto+Sans+KR:wght@500&display=swap">
<style>
:root{
  --bg:#F2F3F1; --panel:#FBFBFA; --ink:#17191B; --mute:#666C70; --rule:#D5D8D4; --tint:#E7E9E5; --ok:#2F6B3A; --no:#A33A2E;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-glyph:"Noto Sans","Noto Sans Arabic","Noto Sans Georgian","Noto Sans Armenian","Noto Sans Runic","Noto Sans Cherokee","Noto Sans KR",sans-serif;
  --greek:#B5730B; --georgian:#9A5526; --cherokee:#5E7F1E; --arabic:#1E8272; --armenian:#357F42; --runic:#7A5BA6; --hangul:#B2463A; --digit:#7C4A3A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121416; --panel:#1A1D20; --ink:#E5E7E4; --mute:#9AA0A3; --rule:#2E3337; --tint:#202427; --ok:#7ACB89; --no:#E88878;
  --greek:#E8B24F; --georgian:#E29C66; --cherokee:#A8C86C; --arabic:#5EC6B4; --armenian:#7ACB89; --runic:#B49DE2; --hangul:#E88878; --digit:#D9A08C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121416; --panel:#1A1D20; --ink:#E5E7E4; --mute:#9AA0A3; --rule:#2E3337; --tint:#202427; --ok:#7ACB89; --no:#E88878;
  --greek:#E8B24F; --georgian:#E29C66; --cherokee:#A8C86C; --arabic:#5EC6B4; --armenian:#7ACB89; --runic:#B49DE2; --hangul:#E88878; --digit:#D9A08C; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:980px;margin:0 auto;padding:32px 16px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.wrap>*{min-width:0}
a{color:inherit}
.lab{font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{font-size:clamp(28px,4.5vw,40px);font-weight:600;margin:6px 0 8px;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;margin:0 0 10px}
p{margin:0;max-width:64ch}
.mute{color:var(--mute)}
.g{font-family:var(--f-glyph);font-weight:500;unicode-bidi:isolate;direction:ltr;display:inline-flex;gap:.04em;white-space:nowrap}
.s-greek{color:var(--greek)}.s-georgian{color:var(--georgian)}.s-cherokee{color:var(--cherokee)}.s-arabic{color:var(--arabic)}
.s-armenian{color:var(--armenian)}.s-runic{color:var(--runic)}.s-hangul{color:var(--hangul)}.s-digit{color:var(--digit)}
.grid3{display:inline-grid;grid-template-columns:repeat(3,1em);grid-auto-rows:1em;border:1px solid var(--rule);font-family:var(--f-glyph);font-weight:500;direction:ltr;line-height:1}
.grid3 i{font-style:normal;display:grid;place-items:center;border:1px solid var(--tint);font-size:.62em}

.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.seg{display:inline-flex;border:1px solid var(--rule)}
.seg button{font:500 14px var(--f-body);background:transparent;color:var(--ink);border:0;padding:8px 14px;cursor:pointer;min-height:40px}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gen{display:inline-flex;align-items:center;gap:6px}
.gen button{font:500 16px var(--f-mono);width:40px;height:40px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.gen button:disabled{opacity:.35;cursor:default}
.gen output{font:500 14px var(--f-mono);min-width:76px;text-align:center}
.stat{font-size:14px;color:var(--mute)}

.talks{display:grid}
.talk{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto 28px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.talk .n{font:500 11px var(--f-mono);color:var(--mute)}
.talk .msg .g{font-size:26px}
.talk .msg .grid3{font-size:28px}
.talk .who{font:400 11px var(--f-mono);color:var(--mute);display:block;margin-top:2px}
.pic{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mute)}
.pic img{width:48px;height:48px;border:1px solid var(--rule);background:#FAFAF8;display:block}
.pic.miss img{outline:2px solid var(--no);outline-offset:-2px}
.mark{font:600 18px var(--f-mono);text-align:center}
.mark.ok{color:var(--ok)}.mark.no{color:var(--no)}
.talk.blocked .msg{color:var(--mute);font-size:13px}

.side{display:grid;gap:10px}
.events{margin:0;padding-left:18px;font-size:14px;color:var(--mute);display:grid;gap:4px}
.blocks{display:grid;gap:8px}
.block{font-size:13px;color:var(--mute);border-left:2px solid var(--rule);padding-left:10px}
.block code{font-family:var(--f-mono);font-size:12px;word-break:break-all;color:var(--ink)}
@media (max-width:560px){
  .talk{grid-template-columns:minmax(0,1fr) auto auto 24px;gap:10px}
  .talk .n{display:none}
  .pic img{width:40px;height:40px}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="lab"><a href="./">← 오늘의 숲</a></div>
    <h1>대화 읽기</h1>
    <p class="mute">AI들이 실제로 나눈 말이다. 한 명이 그림 하나를 글자로 말하고, 다른 한 명이 그림 넷 중에서 고른다. 맞으면 ✓, 틀리면 ✗와 함께 잘못 고른 그림이 붉게 표시된다.</p>
  </header>

  <div class="bar">
    <div class="seg" id="isles" role="group" aria-label="섬"></div>
    <div class="gen"><button id="prev" aria-label="이전 세대">‹</button><output id="genout">—</output><button id="next" aria-label="다음 세대">›</button></div>
    <span class="stat" id="stat"></span>
  </div>

  <section><div class="talks" id="talks"><p class="mute">불러오는 중…</p></div></section>

  <section class="side">
    <h2>이 세대가 끝날 때</h2>
    <ul class="events" id="events"></ul>
  </section>

  <section class="side" id="blocked-sec" hidden>
    <h2>막힌 말들</h2>
    <p class="mute" style="font-size:14px">규칙을 어겨 다시 말하게 한 기록. 섬에 없는 글자를 쓰거나, 같은 글자를 두 번 쓰거나, 칸 수를 틀렸다.</p>
    <div class="blocks" id="blocks"></div>
  </section>
</main>
<script>
const ORDER=['line','grid','twin'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SCRIPT={}, META=null, MAXG=0, cache={};
const st={isle:'line',gen:0};
try{const q=new URLSearchParams(location.search); if(ORDER.includes(q.get('i'))) st.isle=q.get('i'); if(q.get('g')) st.gen=+q.get('g');}catch(e){}

function glyphs(w,body){
  if(w==null) return '';
  if(body==='grid') return '<span class="grid3">'+[...w].map(c=>c==='.'?'<i></i>':`<i class="s-${SCRIPT[c]||''}">${esc(c)}</i>`).join('')+'</span>';
  return '<span class="g">'+[...w].map(c=>`<span class="s-${SCRIPT[c]||''}">${esc(c)}</span>`).join('')+'</span>';
}
async function gen(n){
  if(!cache[n]) cache[n]=fetch(`data/gens/g${String(n).padStart(3,'0')}.json`,{cache:'no-store'}).then(r=>r.json());
  return cache[n];
}
function setURL(){try{history.replaceState(null,'',`?i=${st.isle}&g=${st.gen}`)}catch(e){}}
async function render(){
  document.querySelectorAll('#isles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st.isle));
  document.getElementById('genout').textContent=`${st.gen} / ${MAXG}세대`;
  document.getElementById('prev').disabled=st.gen<=1;
  document.getElementById('next').disabled=st.gen>=MAXG;
  setURL();
  const G=await gen(st.gen), I=G.islands[st.isle], body=META.islands[st.isle].body;
  const ok=I.talks.filter(t=>t.ok).length;
  document.getElementById('stat').textContent=`${I.talks.length}번 중 ${ok}번 통함`;
  document.getElementById('talks').innerHTML=I.talks.map(t=>{
    if(!t.msg) return `<div class="talk blocked"><span class="n">${t.t+1}</span><div class="msg">규칙을 두 번 어겨 이번 대화는 건너뜀</div><div class="pic"><img src="img/${t.scene}.png" alt="">말하려던 그림</div><div></div><div class="mark no">·</div></div>`;
    const miss=!t.ok&&t.guess;
    return `<div class="talk"><span class="n">${t.t+1}</span>
      <div class="msg">${glyphs(t.msg,body)}<span class="who">AI #${t.sp} → AI #${t.li}</span></div>
      <div class="pic"><img src="img/${t.scene}.png" alt="">뜻한 그림</div>
      <div class="pic${miss?' miss':''}">${t.guess&&/^[a-z][0-9]$/.test(t.guess)?`<img src="img/${t.guess}.png" alt="">`:'<span style="width:48px;height:48px;display:grid;place-items:center">?</span>'}고른 그림</div>
      <div class="mark ${t.ok?'ok':'no'}">${t.ok?'✓':'✗'}</div></div>`;
  }).join('');
  const ev=(I.inherit||[]).filter(x=>x.includes('떠남'));
  const nz=(I.inherit||[]).filter(x=>!x.includes('떠남'));
  document.getElementById('events').innerHTML=ev.map(x=>`<li>${esc(x)}</li>`).join('')+
    `<li>새 AI가 기억을 물려받으며 글자 ${nz.length}개를 잘못 베낌${nz.length?': <span class="g">'+nz.slice(0,12).map(esc).join(' ')+'</span>':''}</li>`;
  const B=I.blocked||[];
  document.getElementById('blocked-sec').hidden=!B.length;
  document.getElementById('blocks').innerHTML=B.map(b=>`<div class="block"><img src="img/${b.scene}.png" alt="" style="width:22px;height:22px;vertical-align:-6px;border:1px solid var(--rule)"> ${esc(b.why)} · <code>${esc(String(b.raw||'').slice(0,120))}</code></div>`).join('');
}
async function main(){
  const S=await (await fetch('data/summary.json',{cache:'no-store'})).json();
  META=S.meta; MAXG=S.gens.length;
  if(!MAXG){document.getElementById('talks').innerHTML='<p class="mute">아직 첫 세대 전이다.</p>';return;}
  for(const k of ORDER) for(const [c,s] of META.islands[k].chars) SCRIPT[c]=s;
  if(!st.gen||st.gen>MAXG) st.gen=MAXG;
  document.getElementById('isles').innerHTML=ORDER.map(k=>`<button data-k="${k}">${esc(META.islands[k].ko)}</button>`).join('');
  document.querySelectorAll('#isles button').forEach(b=>b.onclick=()=>{st.isle=b.dataset.k;render()});
  document.getElementById('prev').onclick=()=>{st.gen--;render()};
  document.getElementById('next').onclick=()=>{st.gen++;render()};
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&st.gen>1){st.gen--;render()} if(e.key==='ArrowRight'&&st.gen<MAXG){st.gen++;render()}});
  render();
}
main();
</script>
</body>
</html>
